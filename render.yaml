# MedScreen Festival — Render Blueprint (API only)
#
# Frontend: deploy separately on Vercel (see vercel.json).
#
# Monorepo note:
# - Do NOT set rootDir to apps/api. Prisma lives in prisma/ at the repo root,
#   and @medscreen/* workspace packages must be built from the root.
# - This service builds and starts apps/api from the repository root.

services:
  - type: web
    name: medscreen-api
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    healthCheckPath: /api/v1/health

    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - prisma/**
        - scripts/install-playwright-chromium.mjs
        - package.json
        - package-lock.json
        - tsconfig.base.json
        - render.yaml

    buildCommand: >-
      npm ci --ignore-scripts &&
      npx prisma generate &&
      npm run build:packages &&
      npm run build --workspace=@medscreen/api

    # Render injects PORT; map it to API_PORT used by @medscreen/config.
    startCommand: sh -c "API_PORT=${PORT} node apps/api/dist/server.js"

    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      # Skip Playwright browser download during install (PDF engine optional on Render).
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: '1'
      # ─── Set these in the Render Dashboard (or link from an env group) ───
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: WEB_APP_URL
        sync: false
