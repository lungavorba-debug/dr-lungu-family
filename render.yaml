# MedScreen Festival — Render Blueprint (API only)
#
# Frontend: deploy separately on Vercel (see vercel.json).
#
# Monorepo note:
# - rootDir MUST stay at repo root (`.`). Do NOT set Render Dashboard Root Directory to apps/api.
# - Prisma lives in prisma/ at the repo root; @medscreen/* packages build from the root.
# - Build/start scripts auto-detect monorepo root if dashboard rootDir was misconfigured.

services:
  - type: web
    name: medscreen-api
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    rootDir: .
    healthCheckPath: /api/v1/health

    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - prisma/**
        - scripts/render-build.mjs
        - scripts/render-start.mjs
        - scripts/resolve-monorepo-root.mjs
        - scripts/install-playwright-chromium.mjs
        - scripts/postinstall.mjs
        - package.json
        - package-lock.json
        - tsconfig.base.json
        - render.yaml

    buildCommand: node scripts/render-build.mjs

    startCommand: node scripts/render-start.mjs

    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: STORAGE_LOCAL_PATH
        value: ./storage
      # Skip heavy browser downloads (PDF/WhatsApp Web optional on Render).
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: '1'
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: 'true'
      - key: SKIP_POSTINSTALL
        value: '1'
      # ─── Required in Render Dashboard (production) ───
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: WEB_APP_URL
        sync: false
