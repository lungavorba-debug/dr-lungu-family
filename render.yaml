# MedScreen Festival — Render Blueprint (API only)
#
# Frontend: deploy separately on Vercel (see vercel.json).
#
# Monorepo note:
# - Do NOT set rootDir to apps/api. Prisma lives in prisma/ at the repo root,
#   and @medscreen/* workspace packages must be built from the root.
# - Build logic is centralized in scripts/render-build.mjs.

services:
  - type: web
    name: medscreen-api
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    healthCheckPath: /api/v1/health

    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - prisma/**
        - scripts/render-build.mjs
        - scripts/install-playwright-chromium.mjs
        - scripts/postinstall.mjs
        - package.json
        - package-lock.json
        - tsconfig.base.json
        - render.yaml

    buildCommand: node scripts/render-build.mjs

    # Render injects PORT; map it to API_PORT used by @medscreen/config.
    startCommand: sh -c "API_PORT=${PORT} node apps/api/dist/server.js"

    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: STORAGE_LOCAL_PATH
        value: ./storage
      # Skip heavy browser downloads (PDF/WhatsApp Web optional on Render).
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: '1'
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: 'true'
      - key: SKIP_POSTINSTALL
        value: '1'
      # ─── Required in Render Dashboard (production) ───
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: WEB_APP_URL
        sync: false
