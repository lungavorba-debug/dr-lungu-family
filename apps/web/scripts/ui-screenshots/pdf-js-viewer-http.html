<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { margin: 0; background: #525659; }
    #wrap { padding: 16px; }
    canvas { background: white; display: block; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
    #status { color: white; font: 14px sans-serif; text-align: center; padding: 8px; }
  </style>
</head>
<body>
  <div id="status">loading...</div>
  <div id="wrap"><canvas id="c"></canvas></div>
  <script type="module">
    import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
    try {
      const pdf = await pdfjsLib.getDocument('http://localhost:8765/participant-report-ideal-weight-verification.pdf').promise;
      const page = await pdf.getPage(1);
      const viewport = page.getViewport({ scale: 1.35 });
      const canvas = document.getElementById('c');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvas, viewport }).promise;
      document.getElementById('status').textContent = 'ready';
    } catch (error) {
      document.getElementById('status').textContent = 'error:' + error.message;
      throw error;
    }
  </script>
</body>
</html>
