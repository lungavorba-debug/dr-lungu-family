<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <style>
    body { margin: 0; background: #525659; }
    #wrap { padding: 16px; }
    canvas { background: white; display: block; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
    #status { color: white; font: 14px sans-serif; text-align: center; padding: 8px; }
  </style>
</head>
<body>
  <div id="status">loading...</div>
  <div id="wrap"><canvas id="c"></canvas></div>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    pdfjsLib.getDocument('http://localhost:8765/participant-report-ideal-weight-verification.pdf').promise.then(function (pdf) {
      return pdf.getPage(1);
    }).then(function (page) {
      var viewport = page.getViewport({ scale: 1.35 });
      var canvas = document.getElementById('c');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      return page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
    }).then(function () {
      document.getElementById('status').textContent = 'ready';
    }).catch(function (error) {
      document.getElementById('status').textContent = 'error:' + error.message;
    });
  </script>
</body>
</html>
