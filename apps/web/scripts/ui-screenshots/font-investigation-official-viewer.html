<!DOCTYPE html><html><head><meta charset="utf-8"/><script src="./pdf.min.js"></script>
<style>body{margin:0;background:#525659}#wrap{padding:16px}canvas{background:#fff;display:block;margin:0 auto}#status{color:#fff;font:14px sans-serif;text-align:center;padding:8px}</style></head>
<body><div id="status">loading...</div><div id="wrap"><canvas id="c"></canvas></div>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc='./pdf.worker.min.js';
pdfjsLib.getDocument('./font-investigation-official.pdf').promise.then(p=>p.getPage(1)).then(page=>{const vp=page.getViewport({scale:1.5});const c=document.getElementById('c');c.width=vp.width;c.height=vp.height;return page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}).then(()=>document.getElementById('status').textContent='ready');</script></body></html>
