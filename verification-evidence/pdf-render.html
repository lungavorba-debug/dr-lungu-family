<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <title>PDF render — verification</title>
  <style>
    body { margin: 0; background: #eef1f5; padding: 16px; }
    canvas { display: block; margin: 0 auto; background: #fff; box-shadow: 0 8px 32px rgba(0,0,0,.12); }
  </style>
</head>
<body>
  <canvas id="page"></canvas>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    pdfjsLib.getDocument('02-generated-report.pdf').promise.then((pdf) =>
      pdf.getPage(1).then((page) => {
        const viewport = page.getViewport({ scale: 1.35 });
        const canvas = document.getElementById('page');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        return page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      }),
    );
  </script>
</body>
</html>
